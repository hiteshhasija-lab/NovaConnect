# NovaConnect — fresh install on one server (README.md, "Fresh install").
#
#   cp .env.example .env          then fill it in
#   mkdir certs                   then add certs/key.pem and certs/cert.pem
#   docker compose up -d --build  (or: podman compose up -d --build)
#
# On first start NovaConnect creates its database tables itself (src/migrate.js) and the first admin
# account from ADMIN_USERNAME / ADMIN_PASSWORD. Upgrading later: pull the new code, then
# `up -d --build --force-recreate novaconnect` (podman-compose keeps the old container without
# --force-recreate); new migrations apply themselves at startup.
name: novaconnect

services:
  novaconnect:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/novaconnect:local
    restart: unless-stopped
    env_file: .env
    environment:
      # The other services, by their names on this compose network.
      PGHOST: postgres
      PGPORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEILI_HOST: http://meilisearch:7700
      # Media port range, the same one published below.
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40499}
    # NOVACONNECT_BIND_IP: listen on one of the server's addresses only (for a server with several
    # IPs, like one per app); default all of them.
    ports:
      - "${NOVACONNECT_BIND_IP:-0.0.0.0}:${NOVACONNECT_HTTP_PORT:-80}:8080"
      - "${NOVACONNECT_BIND_IP:-0.0.0.0}:${NOVACONNECT_HTTPS_PORT:-443}:8443"
      # Call and meeting media (mediasoup). Browsers send audio/video straight to these ports on
      # MEDIASOUP_ANNOUNCED_IP, so they must be open in the server's firewall too. Podman's compose
      # network can't publish much more than 500 ports in one range, hence 40000-40499 by default
      # (about 250 people in calls at once).
      - "${NOVACONNECT_BIND_IP:-0.0.0.0}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40499}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40499}/udp"
    volumes:
      # TLS certificate: browsers only allow camera/microphone on https. ':z' lets the container
      # read it on SELinux hosts (RHEL, Fedora); other hosts ignore it.
      - ./certs:/app/certs:ro,z
      # Uploaded files and meeting recordings (with STORAGE_DRIVER=local).
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sessions (required) and the multi-worker realtime adapter.
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Message search. NovaConnect still runs without it (searches then fail and are logged).
  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  redisdata:
  meilidata:
  uploads:
