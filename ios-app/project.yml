# XcodeGen spec — generate the Xcode project with `xcodegen generate` (brew install xcodegen).
name: NovaConnect
options:
  bundleIdPrefix: com.novaconnect
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    # Baked into Info.plist so the app goes straight to your server on first launch.
    NOVACONNECT_DEFAULT_SERVER_URL: "https://10.0.0.102"
targets:
  NovaConnect:
    type: application
    platform: iOS
    sources: [NovaConnect]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaconnect.ios
        INFOPLIST_FILE: NovaConnect/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"

  NovaConnectNative:
    type: application
    platform: iOS
    sources:
      - path: Native
      - path: NovaConnect/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaconnect.native
        INFOPLIST_FILE: Native/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
  NovaConnectNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: NovaConnectNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  NovaConnectNative:
    build:
      targets:
        NovaConnectNative: all
        NovaConnectNativeTests: [test]
    test:
      targets: [NovaConnectNativeTests]
    archive:
      config: Release
