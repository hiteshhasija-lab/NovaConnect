<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NovaConnect — Server Settings</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 28px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5; color: #242424;
  }
  h1 { font-size: 16px; margin: 0 0 4px; color: #464775; }
  p { font-size: 13px; color: #616161; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
    border: 1px solid #e1e1e6; border-radius: 6px; outline: none;
  }
  input:focus { border-color: #5b5fc7; box-shadow: 0 0 0 3px rgba(91,95,199,.18); }
  .row { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
  button {
    font-size: 13px; padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer;
  }
  .primary { background: #5b5fc7; color: #fff; }
  .primary:hover { background: #464775; }
  .secondary { background: transparent; color: #616161; }
  #error { color: #c4314b; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1>Connect to NovaConnect</h1>
  <p>Enter the address of your organization's NovaConnect server.</p>
  <label for="url">Server address</label>
  <input id="url" type="text" placeholder="https://novaconnect.example.com" autofocus>
  <div id="error"></div>
  <div class="row">
    <button class="secondary" id="cancel">Cancel</button>
    <button class="primary" id="save">Connect</button>
  </div>
  <script>
    const input = document.getElementById('url');
    const errorEl = document.getElementById('error');
    window.novaconnectSettings.get().then(({ serverUrl }) => { if (serverUrl) input.value = serverUrl; });

    document.getElementById('save').onclick = async () => {
      const raw = input.value.trim();
      let parsed;
      try { parsed = new URL(raw); } catch { errorEl.textContent = 'Enter a full address, e.g. https://novaconnect.example.com'; return; }
      if (!['http:', 'https:'].includes(parsed.protocol)) { errorEl.textContent = 'Address must start with http:// or https://'; return; }
      await window.novaconnectSettings.save(parsed.toString());
    };
    document.getElementById('cancel').onclick = () => window.close();
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('save').click(); });
  </script>
</body>
</html>
