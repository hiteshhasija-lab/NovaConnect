name: CI

# Lint + unit tests, then a real fresh install from compose.yaml exactly as README.md "Fresh install"
# describes, so every change is checked to still install on an empty server (#24 step 6).
# Releases to the NOVAAPP01 lab stay with scripts/release.sh: GitHub can't reach that LAN.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Client-server contract (web, iOS) against the routes
        run: node scripts/contract-check.js
      - run: npm test

  fresh-install:
    name: Fresh install (compose.yaml)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Settings from .env.example
        run: |
          gen() { openssl rand -hex 32; }
          ADMIN_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          sed -e "s/^PGPASSWORD=$/PGPASSWORD=$(gen)/" \
              -e "s/^SESSION_SECRET=$/SESSION_SECRET=$(gen)/" \
              -e "s/^REDIS_PASSWORD=$/REDIS_PASSWORD=$(gen)/" \
              -e "s/^MEILI_API_KEY=$/MEILI_API_KEY=$(gen)/" \
              -e "s/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=$ADMIN_PASSWORD/" \
              -e "s/^MEDIASOUP_ANNOUNCED_IP=$/MEDIASOUP_ANNOUNCED_IP=127.0.0.1/" \
              -e "s/^NOVACONNECT_HTTP_PORT=80$/NOVACONNECT_HTTP_PORT=8080/" \
              -e "s/^NOVACONNECT_HTTPS_PORT=443$/NOVACONNECT_HTTPS_PORT=8443/" \
              .env.example > .env
          # One media worker and a small port range keep Docker's port proxy light on the runner.
          printf 'MEDIASOUP_WORKERS=1\nMEDIASOUP_RTC_MIN_PORT=40000\nMEDIASOUP_RTC_MAX_PORT=40015\n' >> .env
          # Shared secret for the NovaDesk integration endpoints, used by the idempotency check below.
          SYNC_API_KEY=$(gen)
          echo "::add-mask::$SYNC_API_KEY"
          echo "SYNC_API_KEY=$SYNC_API_KEY" >> "$GITHUB_ENV"
          echo "SYNC_API_KEY=$SYNC_API_KEY" >> .env
          # No certificate here, so NovaConnect serves http only (as README says it will).
          mkdir -p certs
          grep -cE '^[A-Z_]+=.+' .env

      - name: Start (docker compose up -d --build)
        run: docker compose up -d --build

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && exit 0; sleep 3; done
          echo "NovaConnect did not become healthy"; exit 1

      - name: First start created the database and the admin
        run: |
          docker compose logs novaconnect > first-start.log
          grep -q "Database migrations applied" first-start.log
          grep -q 'Created the first admin account "admin"' first-start.log
          if grep -q "call presence reset failed" first-start.log; then echo "call presence reset ran before migrations"; exit 1; fi
          if grep -qi "demo workspace" first-start.log; then echo "demo workspace created without SEED_DEMO"; exit 1; fi

      - name: The first admin can sign in
        run: |
          code=$(curl -s -o login.json -w '%{http_code}' -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          echo "login: HTTP $code"; test "$code" = 200
          grep -q '"role":"admin"' login.json
          curl -fsS -b cookies.txt http://localhost:8080/api/mobile/session | grep -q '"username":"admin"'

      - name: NovaDesk card posts are idempotent
        run: |
          sql() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "$1" < /dev/null | head -1; }
          team=$(sql "insert into teams (name) values ('CI') returning id")
          ch=$(sql "insert into channels (team_id, name) values ($team, 'ci-decom') returning id")
          post() {
            curl -s -o post.json -w '%{http_code}' -H "Authorization: Bearer $SYNC_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"channel_id\":$ch,\"body\":\"ci card\"$1}" http://localhost:8080/api/integrations/novadesk/decom-updates
          }
          test "$(post ',"idempotency_key":"ci-key-1"')" = 201
          first=$(cat post.json)
          test "$(post ',"idempotency_key":"ci-key-1"')" = 200
          grep -q '"duplicate":true' post.json
          # The repeat answers with the first message's id and stores nothing new.
          test "$(grep -o '"messageId":[0-9]*' post.json)" = "$(echo "$first" | grep -o '"messageId":[0-9]*')"
          test "$(sql "select count(*) from messages where idempotency_key = 'ci-key-1'")" = 1
          # A different key is a different message, and posts without a key behave as before.
          test "$(post ',"idempotency_key":"ci-key-2"')" = 201
          test "$(post '')" = 201
          test "$(post '')" = 201
          test "$(sql "select count(*) from messages where channel_id = $ch")" = 4
          # Wrong credentials are still refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' -H 'Content-Type: application/json' \
            -d "{\"channel_id\":$ch,\"body\":\"x\"}" http://localhost:8080/api/integrations/novadesk/decom-updates)
          test "$code" = 401

      - name: Search finds a message (Meilisearch end to end)
        run: |
          # Global search was broken for every query (the index did not allow the `deleted` filter),
          # and nothing in CI used it. The index is rebuilt from the database at start-up, so a
          # restart also exercises the reindex.
          sql() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "$1" < /dev/null | head -1; }
          now="to_char(now() at time zone 'utc','YYYY-MM-DD HH24:MI:SS')"
          uid=$(sql "select id from users where username = 'admin'")
          team=$(sql "insert into teams (name) values ('CI search') returning id")
          ch=$(sql "insert into channels (team_id, name) values ($team, 'ci-search') returning id")
          sql "insert into team_members (team_id, user_id, role, joined_at) values ($team, $uid, 'member', $now)" > /dev/null
          sql "insert into messages (channel_id, user_id, body, created_at, updated_at) values ($ch, $uid, 'ciquokka search marker', $now, $now)" > /dev/null
          docker compose restart novaconnect
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health > /dev/null && break; sleep 3; done
          curl -s -o /dev/null -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o search.json -w '%{http_code}' -b cookies.txt "http://localhost:8080/api/search?q=ciquokka")
            if [ "$code" = 200 ] && grep -q 'ciquokka' search.json; then break; fi
            sleep 2
          done
          if ! { [ "$code" = 200 ] && grep -q 'ciquokka' search.json; }; then
            echo "search did not return the message (last HTTP $code)"; cat search.json; echo
            docker compose logs novaconnect | grep -i search | tail -10
            exit 1
          fi
          # The response is the shape the web client renders: messages, files, people.
          grep -q '"messages":\[{' search.json && grep -q '"files":\[' search.json && grep -q '"people":\[' search.json
          grep -q '"source":"meilisearch"' search.json
          echo "search: found the message through Meilisearch"
          # With Meilisearch down, search still answers, from the database.
          docker compose stop meilisearch
          code=$(curl -s -o search-down.json -w '%{http_code}' -b cookies.txt "http://localhost:8080/api/search?q=ciquokka")
          echo "search with Meilisearch down: HTTP $code"
          test "$code" = 200
          grep -q 'ciquokka' search-down.json
          grep -q '"source":"postgres"' search-down.json
          docker compose start meilisearch

      - name: Production security headers
        run: |
          curl -sI http://localhost:8080/login | tee headers.txt
          grep -qi '^content-security-policy:.*cdn.jsdelivr.net' headers.txt
          grep -qi '^content-security-policy:.*report-uri /csp-report' headers.txt
          # The report endpoint accepts a browser-style report and logs it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/csp-report' \
            -d '{"csp-report":{"document-uri":"http://localhost:8080/ci","effective-directive":"script-src-elem","blocked-uri":"https://ci-check.invalid/x.js","disposition":"enforce"}}' \
            http://localhost:8080/csp-report)
          echo "csp-report: HTTP $code"; test "$code" = 204
          sleep 1; docker compose logs novaconnect | grep -q 'ci-check.invalid'

      - name: Feature walk-through (every main flow, with the live events other people receive)
        run: |
          # `ws` (a socket.io dependency) comes from a scratch folder, not from the app's install.
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/walk-deps" ws@8
          NODE_PATH="$RUNNER_TEMP/walk-deps/node_modules" node scripts/walkthrough.js
        env:
          BASE_URL: http://localhost:8080

      - name: Browser check (production CSP, no blocked scripts or JavaScript errors)
        run: |
          # Playwright lives in a scratch folder so it never touches the app's dependencies.
          mkdir -p "$RUNNER_TEMP/browser-check"
          cp scripts/ci-browser-check.mjs "$RUNNER_TEMP/browser-check/"
          cd "$RUNNER_TEMP/browser-check"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node ci-browser-check.mjs
        env:
          BASE_URL: http://localhost:8080

      - name: A restart keeps the data
        run: |
          docker compose restart novaconnect
          sleep 5
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          docker compose logs novaconnect > restart.log
          grep -q "Database schema is up to date" restart.log
          test "$(grep -c 'Created the first admin account' restart.log)" = 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          test "$code" = 200

      - name: Backup, wipe and restore (README "Backups" and "Restore")
        run: |
          state() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "select (select count(*) from users) || ' users, ' || (select count(*) from meet_links) || ' meeting links, admin created ' || (select created_at from users where username='admin')" < /dev/null; }
          docker compose exec -T novaconnect sh -c 'echo ci-restore-marker > /app/data/uploads/ci-marker.txt' < /dev/null
          before=$(state); echo "before: $before"
          docker compose exec -T postgres pg_dump -U novaconnect -Fc novaconnect < /dev/null > novaconnect.dump
          docker compose exec -T novaconnect tar -C /app/data/uploads -cf - . < /dev/null > uploads.tar
          docker compose down -v
          docker compose up -d postgres redis meilisearch
          # The postgres image restarts once while it initialises: wait, pause, wait again.
          for round in 1 2; do
            for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U novaconnect -d novaconnect < /dev/null && break; sleep 2; done
            sleep 6
          done
          docker compose exec -T postgres pg_restore -U novaconnect -d novaconnect --no-owner --exit-on-error < novaconnect.dump
          docker compose run --rm --no-deps -T --entrypoint tar novaconnect -C /app/data/uploads -xf - < uploads.tar
          docker compose up -d novaconnect
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          after=$(state); echo "after:  $after"
          test -n "$before" && test "$before" = "$after"
          docker compose exec -T novaconnect cat /app/data/uploads/ci-marker.txt < /dev/null | grep -q ci-restore-marker
          docker compose logs novaconnect > restored.log
          grep -q "Database schema is up to date" restored.log
          if grep -q "Created the first admin account" restored.log; then echo "a new admin was created instead of restoring"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          echo "login after restore: HTTP $code"; test "$code" = 200

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
