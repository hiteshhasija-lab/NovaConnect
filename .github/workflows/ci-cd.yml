name: CI

# Lint + unit tests, then a real fresh install from compose.yaml exactly as README.md "Fresh install"
# describes, so every change is checked to still install on an empty server (#24 step 6).
# Releases to the NOVAAPP01 lab stay with scripts/release.sh: GitHub can't reach that LAN.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Client-server contract (web, iOS) against the routes
        run: node scripts/contract-check.js
      - run: npm test
      - name: File storage against a real S3 server (SeaweedFS)
        run: |
          mkdir -p "$RUNNER_TEMP/sw"
          S3_AK=ci$(openssl rand -hex 6); S3_SK=$(openssl rand -hex 16)
          echo "::add-mask::$S3_SK"
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$S3_AK" "$S3_SK" > "$RUNNER_TEMP/sw/s3.json"
          docker run -d --name seaweed -p 8333:8333 -v "$RUNNER_TEMP/sw:/cfg" docker.io/chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.config=/cfg/s3.json -master.volumeSizeLimitMB=64 -volume.max=4
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && break; sleep 1; done
          sleep 5
          S3_AK="$S3_AK" S3_SK="$S3_SK" node -e '
            const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
            const c = new S3Client({ region: "us-east-1", endpoint: "http://localhost:8333", forcePathStyle: true, credentials: { accessKeyId: process.env.S3_AK, secretAccessKey: process.env.S3_SK } });
            c.send(new CreateBucketCommand({ Bucket: "nc-test" })).then(() => console.log("bucket created"), (e) => { console.error(e); process.exit(1); });'
          S3_TEST_ENDPOINT=http://localhost:8333 S3_TEST_BUCKET=nc-test S3_TEST_ACCESS_KEY="$S3_AK" S3_TEST_SECRET_KEY="$S3_SK" node --test test/storage.s3.test.js
          docker rm -f seaweed

  fresh-install:
    name: Fresh install (compose.yaml)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Settings from .env.example
        run: |
          gen() { openssl rand -hex 32; }
          ADMIN_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          sed -e "s/^PGPASSWORD=$/PGPASSWORD=$(gen)/" \
              -e "s/^SESSION_SECRET=$/SESSION_SECRET=$(gen)/" \
              -e "s/^REDIS_PASSWORD=$/REDIS_PASSWORD=$(gen)/" \
              -e "s/^MEILI_API_KEY=$/MEILI_API_KEY=$(gen)/" \
              -e "s/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=$ADMIN_PASSWORD/" \
              -e "s/^MEDIASOUP_ANNOUNCED_IP=$/MEDIASOUP_ANNOUNCED_IP=127.0.0.1/" \
              -e "s/^NOVACONNECT_HTTP_PORT=80$/NOVACONNECT_HTTP_PORT=8080/" \
              -e "s/^NOVACONNECT_HTTPS_PORT=443$/NOVACONNECT_HTTPS_PORT=8443/" \
              .env.example > .env
          # One media worker and a small port range keep Docker's port proxy light on the runner.
          printf 'MEDIASOUP_WORKERS=1\nMEDIASOUP_RTC_MIN_PORT=40000\nMEDIASOUP_RTC_MAX_PORT=40015\n' >> .env
          # Shared secret for the NovaDesk integration endpoints, used by the idempotency check below.
          SYNC_API_KEY=$(gen)
          echo "::add-mask::$SYNC_API_KEY"
          echo "SYNC_API_KEY=$SYNC_API_KEY" >> "$GITHUB_ENV"
          echo "SYNC_API_KEY=$SYNC_API_KEY" >> .env
          # No certificate here, so NovaConnect serves http only (as README says it will).
          mkdir -p certs
          grep -cE '^[A-Z_]+=.+' .env

      - name: Start (docker compose up -d --build)
        run: docker compose up -d --build

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && exit 0; sleep 3; done
          echo "NovaConnect did not become healthy"; exit 1

      - name: First start created the database and the admin
        run: |
          docker compose logs novaconnect > first-start.log
          grep -q "Database migrations applied" first-start.log
          grep -q 'Created the first admin account "admin"' first-start.log
          if grep -q "call presence reset failed" first-start.log; then echo "call presence reset ran before migrations"; exit 1; fi
          if grep -qi "demo workspace" first-start.log; then echo "demo workspace created without SEED_DEMO"; exit 1; fi

      - name: The first admin can sign in
        run: |
          code=$(curl -s -o login.json -w '%{http_code}' -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          echo "login: HTTP $code"; test "$code" = 200
          grep -q '"role":"admin"' login.json
          curl -fsS -b cookies.txt http://localhost:8080/api/mobile/session | grep -q '"username":"admin"'

      - name: NovaDesk card posts are idempotent
        run: |
          sql() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "$1" < /dev/null | head -1; }
          team=$(sql "insert into teams (name) values ('CI') returning id")
          ch=$(sql "insert into channels (team_id, name) values ($team, 'ci-decom') returning id")
          post() {
            curl -s -o post.json -w '%{http_code}' -H "Authorization: Bearer $SYNC_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"channel_id\":$ch,\"body\":\"ci card\"$1}" http://localhost:8080/api/integrations/novadesk/decom-updates
          }
          test "$(post ',"idempotency_key":"ci-key-1"')" = 201
          first=$(cat post.json)
          test "$(post ',"idempotency_key":"ci-key-1"')" = 200
          grep -q '"duplicate":true' post.json
          # The repeat answers with the first message's id and stores nothing new.
          test "$(grep -o '"messageId":[0-9]*' post.json)" = "$(echo "$first" | grep -o '"messageId":[0-9]*')"
          test "$(sql "select count(*) from messages where idempotency_key = 'ci-key-1'")" = 1
          # A different key is a different message, and posts without a key behave as before.
          test "$(post ',"idempotency_key":"ci-key-2"')" = 201
          test "$(post '')" = 201
          test "$(post '')" = 201
          test "$(sql "select count(*) from messages where channel_id = $ch")" = 4
          # Wrong credentials are still refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' -H 'Content-Type: application/json' \
            -d "{\"channel_id\":$ch,\"body\":\"x\"}" http://localhost:8080/api/integrations/novadesk/decom-updates)
          test "$code" = 401

      - name: Search finds a message (Meilisearch end to end)
        run: |
          # Global search was broken for every query (the index did not allow the `deleted` filter),
          # and nothing in CI used it. The index is rebuilt from the database at start-up, so a
          # restart also exercises the reindex.
          sql() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "$1" < /dev/null | head -1; }
          now="to_char(now() at time zone 'utc','YYYY-MM-DD HH24:MI:SS')"
          uid=$(sql "select id from users where username = 'admin'")
          team=$(sql "insert into teams (name) values ('CI search') returning id")
          ch=$(sql "insert into channels (team_id, name) values ($team, 'ci-search') returning id")
          sql "insert into team_members (team_id, user_id, role, joined_at) values ($team, $uid, 'member', $now)" > /dev/null
          sql "insert into messages (channel_id, user_id, body, created_at, updated_at) values ($ch, $uid, 'ciquokka search marker', $now, $now)" > /dev/null
          docker compose restart novaconnect
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health > /dev/null && break; sleep 3; done
          curl -s -o /dev/null -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o search.json -w '%{http_code}' -b cookies.txt "http://localhost:8080/api/search?q=ciquokka")
            if [ "$code" = 200 ] && grep -q 'ciquokka' search.json; then break; fi
            sleep 2
          done
          if ! { [ "$code" = 200 ] && grep -q 'ciquokka' search.json; }; then
            echo "search did not return the message (last HTTP $code)"; cat search.json; echo
            docker compose logs novaconnect | grep -i search | tail -10
            exit 1
          fi
          # The response is the shape the web client renders: messages, files, people.
          grep -q '"messages":\[{' search.json && grep -q '"files":\[' search.json && grep -q '"people":\[' search.json
          grep -q '"source":"meilisearch"' search.json
          echo "search: found the message through Meilisearch"
          # With Meilisearch down, search still answers, from the database.
          docker compose stop meilisearch
          code=$(curl -s -o search-down.json -w '%{http_code}' -b cookies.txt "http://localhost:8080/api/search?q=ciquokka")
          echo "search with Meilisearch down: HTTP $code"
          test "$code" = 200
          grep -q 'ciquokka' search-down.json
          grep -q '"source":"postgres"' search-down.json
          docker compose start meilisearch

      - name: Production security headers
        run: |
          curl -sI http://localhost:8080/login | tee headers.txt
          grep -qi '^content-security-policy:.*cdn.jsdelivr.net' headers.txt
          grep -qi '^content-security-policy:.*report-uri /csp-report' headers.txt
          # The report endpoint accepts a browser-style report and logs it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/csp-report' \
            -d '{"csp-report":{"document-uri":"http://localhost:8080/ci","effective-directive":"script-src-elem","blocked-uri":"https://ci-check.invalid/x.js","disposition":"enforce"}}' \
            http://localhost:8080/csp-report)
          echo "csp-report: HTTP $code"; test "$code" = 204
          sleep 1; docker compose logs novaconnect | grep -q 'ci-check.invalid'

      - name: Feature walk-through (every main flow, with the live events other people receive)
        run: |
          # `ws` (a socket.io dependency) comes from a scratch folder, not from the app's install.
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/walk-deps" ws@8
          NODE_PATH="$RUNNER_TEMP/walk-deps/node_modules" node scripts/walkthrough.js
        env:
          BASE_URL: http://localhost:8080

      - name: The server logged no errors during the walk-through
        run: |
          docker compose logs novaconnect > walk.log
          if grep -qE '"level":"(error|fatal)"' walk.log; then grep -E '"level":"(error|fatal)"' walk.log | head -5; echo "errors in the server log"; exit 1; fi

      - name: Message retention deletes exactly what is past the policy
        run: |
          # Backdated rows, a 1-year policy for channels, "Run now", then what is left. Chats follow
          # their own setting; a thread's post stays (cleared) while it has newer replies; a NovaDesk
          # card still waiting for an answer is kept; a stored file another attachment uses is kept.
          sql() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "$1" < /dev/null | head -1; }
          old="'2024-01-01 00:00:00'"; now="to_char(now() at time zone 'utc','YYYY-MM-DD HH24:MI:SS')"
          uid=$(sql "select id from users where username = 'admin'")
          team=$(sql "insert into teams (name) values ('CI retention') returning id")
          ch=$(sql "insert into channels (team_id, name) values ($team, 'ci-retention') returning id")
          convo=$(sql "insert into dm_conversations (is_group) values (0) returning id")
          ins() { sql "insert into messages (channel_id, conversation_id, user_id, body, parent_message_id, metadata, created_at, updated_at) values ($1, $2, $uid, '$3', $4, $5, $6, $6) returning id"; }
          old_post=$(ins $ch null 'old post' null null "$old")
          new_post=$(ins $ch null 'new post' null null "$now")
          thread=$(ins $ch null 'old thread' null null "$old")
          old_reply=$(ins $ch null 'old reply' $thread null "$old")
          new_reply=$(ins $ch null 'new reply' $thread null "$now")
          card=$(ins $ch null 'pending card' null "'{\"cardType\":\"decom_approval\",\"status\":\"pending\"}'" "$old")
          done_card=$(ins $ch null 'answered card' null "'{\"cardType\":\"decom_approval\",\"status\":\"approved\"}'" "$old")
          old_chat=$(ins null $convo 'old chat' null null "$old")
          att() { sql "insert into attachments (message_id, filename, original_name, mime_type, size, uploaded_by, storage_driver, storage_key) values ($1, '$2', 'x.txt', 'text/plain', 2, $uid, 'local', '$2') returning id" > /dev/null; }
          att $old_post ci-ret-only; att $old_post ci-ret-shared; att $new_post ci-ret-shared
          docker compose exec -T novaconnect sh -c 'd="${LOCAL_UPLOAD_ROOT:-/app/data/uploads}"; mkdir -p "$d"; echo x > "$d/ci-ret-only"; echo x > "$d/ci-ret-shared"' < /dev/null
          stored() { docker compose exec -T novaconnect sh -c "test -f \"\${LOCAL_UPLOAD_ROOT:-/app/data/uploads}/$1\" && echo yes || echo no" < /dev/null; }
          curl -s -o /dev/null -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login
          policy() { curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -d "channel_days=$1&chat_days=$2&confirm=1" http://localhost:8080/admin/retention; }
          run() { curl -s -b cookies.txt -H 'Accept: application/json' -X POST http://localhost:8080/admin/retention/run; echo; }
          test "$(policy 365 forever)" = 200
          run
          test "$(sql "select count(*) from messages where id in ($old_post, $old_reply, $done_card)")" = 0
          test "$(sql "select count(*) from messages where id in ($new_post, $new_reply, $card, $old_chat)")" = 4
          test "$(sql "select deleted || ':' || body from messages where id = $thread")" = "1:"
          test "$(stored ci-ret-only)" = no
          test "$(stored ci-ret-shared)" = yes
          test "$(sql "select count(*) from attachments where storage_key = 'ci-ret-shared'")" = 1
          test "$(policy 365 30)" = 200
          run
          test "$(sql "select count(*) from messages where id = $old_chat")" = 0
          # Once the thread's last reply has expired too, the post goes with it.
          sql "update messages set created_at = $old where id = $new_reply" > /dev/null
          run
          test "$(sql "select count(*) from messages where id in ($thread, $new_reply)")" = 0
          test "$(sql "select count(*) from messages where id in ($new_post, $card)")" = 2
          test "$(sql "select count(*) from audit_log where action = 'retention.run'")" -ge 3
          test "$(sql "select count(*) from audit_log where action = 'retention.policy'")" -ge 2
          # A legal hold on the channel keeps an expired message until the hold is released.
          held_old=$(ins $ch null 'held old' null null "$old")
          hold=$(curl -s -b cookies.txt -H 'Accept: application/json' -d "name=CI+hold&scope_type=channel&channel_id=$ch" http://localhost:8080/admin/holds | grep -o '"id":[0-9]*' | cut -d: -f2)
          test -n "$hold"
          run
          test "$(sql "select count(*) from messages where id = $held_old")" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -H 'Accept: application/json' -X POST http://localhost:8080/admin/holds/$hold/release)" = 200
          run
          test "$(sql "select count(*) from messages where id = $held_old")" = 0
          test "$(policy forever forever)" = 200
          echo "retention: deleted what was past the policy, kept the rest (and what was on hold)"

      - name: Browser check (production CSP, no blocked scripts or JavaScript errors)
        run: |
          # Playwright lives in a scratch folder so it never touches the app's dependencies.
          mkdir -p "$RUNNER_TEMP/browser-check"
          cp scripts/ci-browser-check.mjs "$RUNNER_TEMP/browser-check/"
          cd "$RUNNER_TEMP/browser-check"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node ci-browser-check.mjs
        env:
          BASE_URL: http://localhost:8080

      - name: A restart keeps the data
        run: |
          docker compose restart novaconnect
          sleep 5
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          docker compose logs novaconnect > restart.log
          grep -q "Database schema is up to date" restart.log
          test "$(grep -c 'Created the first admin account' restart.log)" = 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          test "$code" = 200

      - name: Backup, wipe and restore (README "Backups" and "Restore")
        run: |
          state() { docker compose exec -T postgres psql -U novaconnect -d novaconnect -Atc "select (select count(*) from users) || ' users, ' || (select count(*) from meet_links) || ' meeting links, admin created ' || (select created_at from users where username='admin')" < /dev/null; }
          docker compose exec -T novaconnect sh -c 'echo ci-restore-marker > /app/data/uploads/ci-marker.txt' < /dev/null
          before=$(state); echo "before: $before"
          docker compose exec -T postgres pg_dump -U novaconnect -Fc novaconnect < /dev/null > novaconnect.dump
          docker compose exec -T novaconnect tar -C /app/data/uploads -cf - . < /dev/null > uploads.tar
          docker compose down -v
          docker compose up -d postgres redis meilisearch
          # The postgres image restarts once while it initialises: wait, pause, wait again.
          for round in 1 2; do
            for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U novaconnect -d novaconnect < /dev/null && break; sleep 2; done
            sleep 6
          done
          docker compose exec -T postgres pg_restore -U novaconnect -d novaconnect --no-owner --exit-on-error < novaconnect.dump
          docker compose run --rm --no-deps -T --entrypoint tar novaconnect -C /app/data/uploads -xf - < uploads.tar
          docker compose up -d novaconnect
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          after=$(state); echo "after:  $after"
          test -n "$before" && test "$before" = "$after"
          docker compose exec -T novaconnect cat /app/data/uploads/ci-marker.txt < /dev/null | grep -q ci-restore-marker
          docker compose logs novaconnect > restored.log
          grep -q "Database schema is up to date" restored.log
          if grep -q "Created the first admin account" restored.log; then echo "a new admin was created instead of restoring"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:8080/api/mobile/login)
          echo "login after restore: HTTP $code"; test "$code" = 200

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  # An existing install keeps working when it is upgraded in place, the way the README describes:
  # start an OLDER release, put data in it, rebuild from this version on the same volumes, and check
  # that the same person still signs in and finds everything. Two baselines: the release before the
  # latest one (what a regularly updated install does) and 1.0.183 (a long jump, over every migration
  # since). The old version is built with this tree's Containerfile (only the dependency step, which
  # does not depend on the source), so a runner-kernel problem in an old recipe cannot fail the test.
  upgrade:
    name: Upgrade in place from ${{ matrix.baseline }} (compose.yaml)
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: the previous release
            ref: auto
          - baseline: 1.0.183
            ref: 1c96cf5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Settings from .env.example, and the old source
        run: |
          gen() { openssl rand -hex 32; }
          ADMIN_PASSWORD=$(openssl rand -hex 12)
          SYNC_API_KEY=$(gen)
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$SYNC_API_KEY"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SYNC_API_KEY=$SYNC_API_KEY" >> "$GITHUB_ENV"
          sed -e "s/^PGPASSWORD=$/PGPASSWORD=$(gen)/" \
              -e "s/^SESSION_SECRET=$/SESSION_SECRET=$(gen)/" \
              -e "s/^REDIS_PASSWORD=$/REDIS_PASSWORD=$(gen)/" \
              -e "s/^MEILI_API_KEY=$/MEILI_API_KEY=$(gen)/" \
              -e "s/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=$ADMIN_PASSWORD/" \
              -e "s/^MEDIASOUP_ANNOUNCED_IP=$/MEDIASOUP_ANNOUNCED_IP=127.0.0.1/" \
              -e "s/^NOVACONNECT_HTTP_PORT=80$/NOVACONNECT_HTTP_PORT=8080/" \
              -e "s/^NOVACONNECT_HTTPS_PORT=443$/NOVACONNECT_HTTPS_PORT=8443/" \
              .env.example > .env
          printf 'MEDIASOUP_WORKERS=1\nMEDIASOUP_RTC_MIN_PORT=40000\nMEDIASOUP_RTC_MAX_PORT=40015\nSYNC_API_KEY=%s\n' "$SYNC_API_KEY" >> .env
          mkdir -p certs
          ref="${{ matrix.ref }}"
          # "auto": the second-latest commit that changed src/version.js = the release before the current one.
          if [ "$ref" = auto ]; then ref=$(git log -n 2 --format=%H -- src/version.js | tail -1); fi
          test "$(git rev-parse "$ref")" != "$(git rev-parse HEAD)"
          echo "Upgrading from $ref ($(git show "$ref:src/version.js" | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+")) to $(git rev-parse --short HEAD) ($(grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" src/version.js))"
          git worktree add "$RUNNER_TEMP/old" "$ref"
          cp Containerfile "$RUNNER_TEMP/old/Containerfile"
          cp .env "$RUNNER_TEMP/old/.env"
          mkdir -p "$RUNNER_TEMP/old/certs"

      - name: Start the old release and put data in it
        working-directory: ${{ runner.temp }}/old
        run: |
          docker compose -p ncup up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          curl -fsS http://localhost:8080/health
          echo "old version: $(docker compose -p ncup exec -T novaconnect node -e 'console.log(require("./src/version"))' < /dev/null)"
          STATE_FILE="$RUNNER_TEMP/upgrade-state.json" node "$GITHUB_WORKSPACE/scripts/upgrade-check.js" seed

      - name: Upgrade in place to this version
        run: |
          # Same project name, same .env, same volumes: only the image and the code change.
          docker compose -p ncup up -d --build --force-recreate novaconnect
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          curl -fsS http://localhost:8080/health
          new="$(grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" src/version.js)"
          running="$(docker compose -p ncup exec -T novaconnect node -e 'console.log(require("./src/version"))' < /dev/null)"
          echo "now running: $running (expected $new)"
          test "$running" = "$new"

      - name: Migrations applied and nothing in the logs
        run: |
          latest=$(ls migrations | sed 's/\.js$//' | sort | tail -1)
          applied=$(docker compose -p ncup exec -T postgres psql -U novaconnect -d novaconnect -Atc "select max(name) from pgmigrations" < /dev/null | head -1)
          echo "newest migration in the code: $latest; newest applied: $applied"
          test "$applied" = "$latest"
          docker compose -p ncup logs novaconnect > upgrade.log
          if grep -qE '"level":"(error|fatal)"' upgrade.log; then grep -E '"level":"(error|fatal)"' upgrade.log | head -5; exit 1; fi

      - name: The same person finds everything after the upgrade
        run: STATE_FILE="$RUNNER_TEMP/upgrade-state.json" node scripts/upgrade-check.js verify

      - name: Walk-through on the upgraded install
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/walk-deps" ws@8
          WALK_SKIP_SCHEDULER=1 NODE_PATH="$RUNNER_TEMP/walk-deps/node_modules" node scripts/walkthrough.js
        env:
          BASE_URL: http://localhost:8080

      - name: The server logged no errors during the walk-through
        run: |
          docker compose -p ncup logs novaconnect > walk.log
          if grep -qE '"level":"(error|fatal)"' walk.log; then grep -E '"level":"(error|fatal)"' walk.log | head -5; echo "errors in the server log"; exit 1; fi

      - name: Logs (on failure)
        if: failure()
        run: docker compose -p ncup logs

      - name: Clean up
        if: always()
        run: docker compose -p ncup down -v
